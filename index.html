<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/apple-music-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Apple Music" />
    <meta name="application-name" content="Apple Music" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Stream high-res lossless music with authentic Apple Music experience." />
    <link rel="manifest" href="/manifest.json" />
    <title>Apple Music</title>
    <style>
      /* Prevent iOS/Android overscroll bouncing */
      html, body {
        height: 100%;
        width: 100%;
        overflow: hidden;
        background-color: #000000;
        color: #ffffff;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Roboto, sans-serif;
      }
      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
    </style>
  </head>
  <body class="bg-black text-white antialiased">
    <div id="root" class="h-full w-full overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
